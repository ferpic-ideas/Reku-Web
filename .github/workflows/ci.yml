name: Reku checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: reku_api_test
          POSTGRES_USER: reku_test
          POSTGRES_PASSWORD: reku_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reku_test -d reku_api_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://reku_test:reku_test_password@127.0.0.1:5432/reku_api_test

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:ci
