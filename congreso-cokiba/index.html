<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Formulario de contacto de Reku para el Congreso COKIBA."
    />
    <title>Congreso COKIBA | Reku</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/congreso-cokiba/styles.css" />
    <script src="/congreso-cokiba/app.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a href="/" class="brand" aria-label="Ir al inicio de Reku">
        <img src="/images/logo-reku.svg" alt="Reku" />
      </a>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">Congreso COKIBA</p>
        <h1 id="page-title">Conectemos</h1>
        <p class="intro-copy">
          Completá tus datos y nos pondremos en contacto con vos.
        </p>
      </section>

      <section class="form-card" aria-label="Formulario de contacto">
        <form id="congreso-form" method="post" action="/congreso-cokiba/" novalidate>
          <input type="hidden" name="reku-form" value="congreso-cokiba" />
          <div class="honeypot" aria-hidden="true">
            <label for="website">Sitio web</label>
            <input id="website" name="website" type="text" tabindex="-1" autocomplete="off" />
          </div>

          <div class="form-grid">
            <div class="field">
              <label for="nombre">Nombre</label>
              <input
                id="nombre"
                name="nombre"
                type="text"
                autocomplete="given-name"
                maxlength="80"
                aria-describedby="nombre-error"
                required
              />
              <p class="field-error" id="nombre-error" aria-live="polite"></p>
            </div>

            <div class="field">
              <label for="apellido">Apellido</label>
              <input
                id="apellido"
                name="apellido"
                type="text"
                autocomplete="family-name"
                maxlength="80"
                aria-describedby="apellido-error"
                required
              />
              <p class="field-error" id="apellido-error" aria-live="polite"></p>
            </div>

            <div class="field field-wide">
              <label for="profesion">Profesión</label>
              <input
                id="profesion"
                name="profesion"
                type="text"
                autocomplete="organization-title"
                maxlength="100"
                placeholder="Ej. Kinesiólogo/a"
                aria-describedby="profesion-error"
                required
              />
              <p class="field-error" id="profesion-error" aria-live="polite"></p>
            </div>

            <div class="field">
              <label for="telefono">Celular</label>
              <input
                id="telefono"
                name="telefono"
                type="tel"
                autocomplete="tel"
                inputmode="tel"
                maxlength="30"
                placeholder="+54 9 11 1234 5678"
                aria-describedby="telefono-error"
                required
              />
              <p class="field-error" id="telefono-error" aria-live="polite"></p>
            </div>

            <div class="field">
              <label for="email">Mail</label>
              <input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                maxlength="254"
                placeholder="nombre@email.com"
                aria-describedby="email-error"
                required
              />
              <p class="field-error" id="email-error" aria-live="polite"></p>
            </div>
          </div>

          <button class="submit-button" id="submit-button" type="submit">
            Enviar
          </button>
          <p class="form-note">
            Usaremos estos datos únicamente para contactarte sobre Reku.
          </p>
          <p class="form-status" id="form-status" aria-live="polite"></p>
        </form>

        <div class="success-state" id="success-state" hidden tabindex="-1">
          <span class="success-mark" aria-hidden="true">✓</span>
          <h2>¡Gracias!</h2>
          <p>Recibimos tus datos correctamente. Nos pondremos en contacto a la brevedad.</p>
          <button class="secondary-button" id="new-response-button" type="button">
            Enviar otra respuesta
          </button>
        </div>
      </section>
    </main>

    <footer>
      <span>© 2026 Reku</span>
      <a href="mailto:hola@reku.io">hola@reku.io</a>
    </footer>
  </body>
</html>
